services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medicalstore
      POSTGRES_USER: medicaluser
      POSTGRES_PASSWORD: medicalpass
    ports: ["5432:5432"]
  v1:
    build: {context: ./app, args: {APP_VERSION: v1}}
    environment: &db
      APP_VERSION: v1
      DB_HOST: db
      DB_NAME: medicalstore
      DB_USER: medicaluser
      DB_PASSWORD: medicalpass
    ports: ["5001:5000"]
    depends_on: [db]
  v2:
    build: {context: ./app, args: {APP_VERSION: v2}}
    environment:
      <<: *db
      APP_VERSION: v2
    ports: ["5002:5000"]
    depends_on: [db]
  v3:
    build: {context: ./app, args: {APP_VERSION: v3}}
    environment:
      <<: *db
      APP_VERSION: v3
    ports: ["5003:5000"]
    depends_on: [db]
