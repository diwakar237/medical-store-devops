apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports: [{containerPort: 5432}]
        env:
        - {name: POSTGRES_DB, value: medicalstore}
        - {name: POSTGRES_USER, value: medicaluser}
        - {name: POSTGRES_PASSWORD, value: medicalpass}
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
        readinessProbe:
          exec: {command: ["sh","-c","pg_isready -U medicaluser -d medicalstore"]}
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: postgres-pvc}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-pvc}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
